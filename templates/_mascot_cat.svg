<svg viewBox="0 0 220 220" width="160" height="160" xmlns="http://www.w3.org/2000/svg" aria-label="코코 고양이" role="img">
  <defs>
    <radialGradient id="catBody-{{ uid|default('x') }}" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="70%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <radialGradient id="catCheek-{{ uid|default('x') }}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="catEar-{{ uid|default('x') }}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="catSoft-{{ uid|default('x') }}" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- 그림자 -->
  <ellipse cx="110" cy="200" rx="58" ry="8" fill="#fbbf24" opacity=".3"/>

  <!-- 왼쪽 귀 (삼각) -->
  <path d="M58 96 L60 40 L104 78 Z" fill="url(#catEar-{{ uid|default('x') }})" stroke="#f59e0b" stroke-width="2"/>
  <path d="M70 84 L72 56 L92 76 Z" fill="#fb7185" opacity=".55"/>
  <!-- 오른쪽 귀 -->
  <path d="M162 96 L160 40 L116 78 Z" fill="url(#catEar-{{ uid|default('x') }})" stroke="#f59e0b" stroke-width="2"/>
  <path d="M150 84 L148 56 L128 76 Z" fill="#fb7185" opacity=".55"/>

  <!-- 머리/몸 -->
  <circle cx="110" cy="120" r="64" fill="url(#catBody-{{ uid|default('x') }})" stroke="#fcd34d" stroke-width="2"/>

  <!-- 볼터치 -->
  <circle cx="74" cy="135" r="11" fill="url(#catCheek-{{ uid|default('x') }})"/>
  <circle cx="146" cy="135" r="11" fill="url(#catCheek-{{ uid|default('x') }})"/>

  <!-- 눈 (깜빡임) -->
  <g fill="#1f1937">
    <ellipse cx="90" cy="116" rx="5" ry="7">
      <animate attributeName="ry" values="7;7;0.6;7;7" keyTimes="0;.45;.5;.55;1" dur="4.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="130" cy="116" rx="5" ry="7">
      <animate attributeName="ry" values="7;7;0.6;7;7" keyTimes="0;.45;.5;.55;1" dur="4.8s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="92" cy="113" r="1.6" fill="#fff"/>
    <circle cx="132" cy="113" r="1.6" fill="#fff"/>
  </g>

  <!-- 코 -->
  <path d="M110 128 q-5 -2 -6 4 q6 5 12 0 q-1 -6 -6 -4 z" fill="#fb7185"/>
  <!-- 입 -->
  <path d="M110 135 q-6 8 -12 4 M110 135 q6 8 12 4" fill="none" stroke="#9a3412" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 수염 -->
  <g stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" opacity=".7">
    <path d="M70 128 L40 122 M70 134 L40 136 M150 128 L180 122 M150 134 L180 136" fill="none"/>
  </g>

  <!-- 하트 -->
  <g transform="translate(110 80)">
    <path d="M0 6 q-10 -16 -16 -2 q-2 8 16 18 q18 -10 16 -18 q-6 -14 -16 2 z" fill="#fb7185" filter="url(#catSoft-{{ uid|default('x') }})">
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1" keyTimes="0;.5;1" dur="1.6s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>
</svg>
